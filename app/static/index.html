<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PowerBI-Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/powerbi-client@2.23.1/dist/powerbi.min.js"></script>
  <style>
    :root { --bg:#f4f5f7; --card:#fff; --ink:#1f2430; --muted:#6b7280;
      --brand:#0b7a4b; --border:#e3e6ea; --code:#f2f3f5; --warn:#b45309; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
    header { background:var(--brand); color:#fff; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; }
    header h1 { margin:0; font-size:20px; font-weight:600; }
    header .sub { font-size:13px; opacity:.85; }
    header .user { font-size:13px; text-align:right; }
    header .user a { color:#fff; opacity:.85; }
    main { max-width:900px; margin:24px auto; padding:0 16px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:20px; }
    label { font-size:13px; font-weight:600; color:var(--muted); display:block; margin-bottom:6px; }
    select, textarea, input[type=text] { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font:inherit; background:#fff; color:var(--ink); }
    textarea { resize:vertical; min-height:70px; }
    input[type=file] { font:inherit; font-size:13px; }
    table.prev { border-collapse:collapse; font-size:12px; }
    table.prev th, table.prev td { border:1px solid var(--border); padding:5px 9px; text-align:left; white-space:nowrap; }
    table.prev th { background:#f2f4f6; }
    table.prev td { color:var(--ink); }
    .tabs { display:flex; gap:8px; margin:0 0 16px; flex-wrap:wrap; }
    .tab { flex:1 1 140px; padding:10px 6px; text-align:center; cursor:pointer; border:1px solid var(--border); border-radius:8px; background:#fff; font-weight:600; font-size:13px; color:var(--muted); }
    .tab.active { background:var(--brand); color:#fff; border-color:var(--brand); }
    .row { margin-bottom:14px; }
    button { font:inherit; border:0; border-radius:8px; font-weight:600; cursor:pointer; }
    button.go { width:100%; padding:12px; background:var(--brand); color:#fff; font-size:15px; margin-top:6px; }
    button.go:disabled { opacity:.6; cursor:default; }
    .actions { display:flex; gap:10px; margin-top:14px; }
    button.sec { flex:1; padding:10px; background:#eef0f2; color:var(--ink); }
    button.prim { flex:1; padding:10px; background:var(--brand); color:#fff; }
    button.undo { margin-top:12px; padding:9px 14px; background:#fff; color:var(--warn); border:1px solid var(--warn); }
    .hint { font-size:12px; color:var(--muted); margin-top:6px; }
    #result:empty { display:none; }
    .explain { background:#eef7f2; border-left:3px solid var(--brand); padding:10px 12px; border-radius:6px; }
    ul.log { margin:12px 0 0; padding-left:20px; }
    ul.log li { margin-bottom:3px; }
    ul.log .vt { display:inline-block; min-width:120px; color:var(--brand); font-weight:600; }
    ul.log .muted { color:var(--muted); font-size:12px; }
    pre { background:var(--code); padding:12px; border-radius:8px; overflow-x:auto; font-size:13px; margin:12px 0 0; }
    .ok { color:var(--brand); font-weight:600; }
    .err { color:#b42318; background:#fef3f2; border-left:3px solid #b42318; padding:10px 12px; border-radius:6px; }
    a.open { display:inline-block; margin-top:12px; padding:10px 16px; border-radius:8px; background:var(--brand); color:#fff; text-decoration:none; font-weight:600; }
    .spinner { color:var(--muted); font-size:14px; }
    .overview { border:1px solid var(--border); border-radius:8px; background:#fafbfc; padding:12px; font-size:13px; }
    .overview .page { font-weight:600; margin:8px 0 4px; }
    .overview .page:first-child { margin-top:0; }
    .overview ul { margin:0 0 4px; padding-left:18px; }
    .overview .vt { display:inline-block; min-width:70px; color:var(--brand); font-weight:600; }
    .overview .muted { color:var(--muted); }
    .preview { height:460px; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:#fff; }
    .preview iframe { border:0; }
    .preview .ph { display:flex; align-items:center; justify-content:center; height:100%; color:var(--muted); font-size:14px; }
    details.fields { margin-top:10px; }
    details.fields summary { font-size:13px; color:var(--muted); cursor:pointer; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>PowerBI-Generator</h1>
      <div class="sub">Dashboards per KI erstellen und anpassen</div>
    </div>
    <div class="user"><span id="userName"></span><br><a href="/logout">Abmelden</a></div>
  </header>

  <main>
    <div class="card">
      <div class="tabs">
        <div class="tab active" data-mode="create">📊 Dashboard erstellen</div>
        <div class="tab" data-mode="modify">✏️ Dashboard anpassen</div>
        <div class="tab" data-mode="measure">📐 Kennzahl hinzufügen</div>
        <div class="tab" data-mode="import">🗄️ Modell aus Datei</div>
        <div class="tab" data-mode="sharepoint">🔗 Aus SharePoint</div>
      </div>

      <div class="row" id="datasetRow">
        <label for="dataset">Datenmodell</label>
        <select id="dataset"><option>Lade…</option></select>
      </div>
      <div class="row" id="reportRow" style="display:none">
        <label for="report">Bestehendes Dashboard</label>
        <select id="report"><option>Lade…</option></select>
      </div>
      <div class="row" id="overviewRow" style="display:none">
        <label>Vorschau</label>
        <div class="preview" id="preview"><div class="ph">Wähle ein Dashboard…</div></div>
        <details class="fields">
          <summary>Enthaltene Felder (zum Referenzieren)</summary>
          <div class="overview" id="overview" style="margin-top:8px"><span class="muted">…</span></div>
        </details>
      </div>

      <div class="row" id="promptRow">
        <label for="prompt" id="promptLabel">Beschreibe das Dashboard</label>
        <textarea id="prompt"></textarea>
        <div class="hint" id="hint"></div>
      </div>

      <div id="importRow" style="display:none">
        <div class="row">
          <label for="importTarget">Was möchtest du tun?</label>
          <select id="importTarget">
            <option value="new">Neues Modell aus Datei anlegen</option>
            <option value="existing">Tabelle zu bestehendem Modell hinzufügen</option>
          </select>
        </div>
        <div class="row" id="importModelNameRow">
          <label for="importModelName">Name des neuen Modells</label>
          <input id="importModelName" type="text" placeholder="z. B. Vertrieb 2025">
        </div>
        <div class="row" id="importExistingRow" style="display:none">
          <label for="importDataset">Zielmodell</label>
          <select id="importDataset"><option>Lade…</option></select>
        </div>
        <div class="row">
          <label for="importFile">Datei (CSV oder Excel)</label>
          <input id="importFile" type="file" accept=".csv,.txt,.xlsx,.xlsm">
        </div>
        <div class="row">
          <label for="importTableName">Tabellenname (optional)</label>
          <input id="importTableName" type="text" placeholder="wird sonst aus dem Dateinamen abgeleitet">
        </div>
        <button class="go" id="importGo">Datei prüfen</button>
      </div>

      <button class="go" id="go">Dashboard erstellen</button>
    </div>

    <div class="card" id="result"></div>
  </main>

  <script>
    let mode = "create";
    let workspaceId = null;
    let pendingPlan = null;
    let pendingCreate = null;
    let pendingSp = null;   // geplantes SharePoint-Modell (noch nicht angelegt)
    const $ = (id) => document.getElementById(id);

    async function api(url, opts) {
      const res = await fetch(url, opts);
      if (res.status === 401) { window.location = "/login"; throw new Error("Nicht angemeldet"); }
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(d.detail || ("Fehler " + res.status));
      return d;
    }

    api("/me").then(u => $("userName").textContent = u.name || u.email).catch(() => {});

    async function refreshDatasets() {
      try {
        const d = await api("/datasets");
        fill("dataset", d.datasets, "id", "name");
        fill("importDataset", d.datasets, "id", "name");
      } catch (e) { /* ignore */ }
    }
    refreshDatasets();

    async function loadReports() {
      try {
        const d = await api("/reports");
        workspaceId = d.workspace_id;
        fill("report", d.reports, "id", "displayName");
        if (mode === "modify") loadOverview();
      } catch (e) { /* ignore */ }
    }
    loadReports();

    function fill(id, items, valKey, txtKey) {
      const sel = $(id); sel.innerHTML = "";
      (items || []).forEach(it => {
        const o = document.createElement("option");
        o.value = it[valKey]; o.textContent = it[txtKey]; sel.appendChild(o);
      });
    }

    $("report").onchange = () => { if (mode === "modify") loadOverview(); };

    function loadOverview() { embedPreview(); loadFields(); }

    async function embedPreview(reportId, elId) {
      const rid = reportId || $("report").value;
      const el = $(elId || "preview");
      if (!rid) { el.innerHTML = '<div class="ph">Kein Dashboard gewählt.</div>'; return; }
      el.innerHTML = '<div class="ph">⏳ Vorschau wird geladen…</div>';
      try {
        const info = await api("/embed-info?report_id=" + encodeURIComponent(rid));
        const pbi = window["powerbi-client"];
        el.innerHTML = "";
        window.powerbi.reset(el);
        window.powerbi.embed(el, {
          type: "report",
          tokenType: pbi.models.TokenType.Embed,
          accessToken: info.token,
          embedUrl: info.embedUrl,
          id: info.reportId,
          settings: { panes: { filters: { visible: false }, pageNavigation: { visible: true } } }
        });
      } catch (e) {
        el.innerHTML = `<div class="ph">Vorschau nicht verfügbar: ${e.message}</div>`;
      }
    }

    async function loadFields() {
      const rid = $("report").value;
      const box = $("overview");
      if (!rid) { box.innerHTML = '<span class="muted">–</span>'; return; }
      box.innerHTML = '<span class="muted">⏳ …</span>';
      try {
        const d = await api("/report-overview?report_id=" + encodeURIComponent(rid));
        const pages = d.pages || [];
        if (!pages.length) { box.innerHTML = '<span class="muted">Keine Visuals gefunden.</span>'; return; }
        box.innerHTML = pages.map(p => {
          const vis = (p.visuals || []).map(v =>
            `<li><span class="vt">${v.type}</span> <span class="muted">${(v.fields || []).join(", ") || "—"}</span></li>`
          ).join("");
          return `<div class="page">📄 ${p.name}</div><ul>${vis || "<li class=muted>leer</li>"}</ul>`;
        }).join("");
      } catch (e) {
        box.innerHTML = `<span class="muted">${e.message}</span>`;
      }
    }

    function setModeUI() {
      const create = mode === "create", modify = mode === "modify",
            measure = mode === "measure", isImport = mode === "import",
            sp = mode === "sharepoint";
      $("datasetRow").style.display = (create || measure) ? "" : "none";
      $("reportRow").style.display = modify ? "" : "none";
      $("overviewRow").style.display = modify ? "" : "none";
      $("promptRow").style.display = isImport ? "none" : "";
      $("go").style.display = isImport ? "none" : "";
      $("importRow").style.display = isImport ? "" : "none";
      if (modify) loadOverview();
      if (isImport) { setImportTargetUI(); return; }
      if (measure) {
        $("promptLabel").textContent = "Beschreibe die Kennzahl";
        $("prompt").placeholder = "z. B. Durchschnittlicher Rohertrag pro Bestellung";
        $("hint").textContent = "Claude erzeugt ein DAX-Measure und fügt es dem Datenmodell hinzu (prüft die DAX vorher).";
        $("go").textContent = "Kennzahl hinzufügen";
      } else if (create) {
        $("promptLabel").textContent = "Beschreibe das Dashboard";
        $("prompt").placeholder = "z. B. Übersicht zum Rohertrag: Kennzahlen als Karten, Rohertrag pro Herkunft und über die Zeit";
        $("hint").textContent = "Claude entwirft das Layout und legt einen neuen Report im Workspace an.";
        $("go").textContent = "Dashboard erstellen";
      } else if (sp) {
        $("promptLabel").textContent = "Welches Modell soll aus SharePoint entstehen?";
        $("prompt").placeholder = "z. B. Ein Modell für unsere Vertriebszahlen";
        $("hint").textContent = "Claude sucht die passenden Dateien in SharePoint und gruppiert sie zu Tabellen – du siehst erst eine Vorschau und bestätigst dann.";
        $("go").textContent = "Datenquellen suchen";
      } else {
        $("promptLabel").textContent = "Was soll geändert werden?";
        $("prompt").placeholder = "z. B. Mach aus dem Balkendiagramm ein Kreisdiagramm und füge eine Karte für Erlös Netto hinzu";
        $("hint").textContent = "Claude plant die Änderungen – du siehst erst eine Vorschau und bestätigst dann.";
        $("go").textContent = "Änderungen planen";
      }
    }
    setModeUI();

    // Offene, unbestätigte Vorschau (Temp-Report) wegräumen, damit keine
    // _Vorschau_-Leichen im Workspace zurückbleiben (Tab-Wechsel / Seite verlassen).
    function discardActivePreview(useBeacon) {
      const pid = (pendingPlan && pendingPlan.preview_report_id) ||
                  (pendingCreate && pendingCreate.preview_report_id);
      if (!pid) return;
      const body = JSON.stringify({ preview_report_id: pid });
      if (useBeacon && navigator.sendBeacon) {
        navigator.sendBeacon("/discard-preview", new Blob([body], { type: "application/json" }));
      } else {
        fetch("/discard-preview", { method: "POST", keepalive: true,
          headers: { "Content-Type": "application/json" }, body }).catch(() => {});
      }
    }
    window.addEventListener("beforeunload", () => discardActivePreview(true));

    document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
      discardActivePreview(false);  // ggf. offene Vorschau des alten Tabs verwerfen
      document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
      t.classList.add("active"); mode = t.dataset.mode;
      pendingPlan = null; pendingCreate = null; pendingSp = null;
      $("result").innerHTML = ""; setModeUI();
    });

    function openLink(id) {
      return workspaceId && id
        ? `<a class="open" href="https://app.powerbi.com/groups/${workspaceId}/reports/${id}" target="_blank">In Power BI öffnen ↗</a>`
        : "";
    }
    function undoButton() { return `<div><button class="undo" id="undoBtn">↩ Rückgängig</button></div>`; }
    function wireUndo() {
      const b = $("undoBtn"); if (!b) return;
      b.onclick = async () => {
        b.disabled = true;
        try { const d = await api("/undo", { method: "POST" });
          $("result").innerHTML = `<p class="ok">${d.undone}</p>`;
          if (mode === "modify") loadOverview(); }
        catch (e) { $("result").innerHTML = `<div class="err">Fehler: ${e.message}</div>`; }
      };
    }

    async function run() {
      const text = $("prompt").value.trim();
      const out = $("result");
      if (!text) { out.innerHTML = '<div class="err">Bitte etwas eingeben.</div>'; return; }
      $("go").disabled = true;
      out.innerHTML = '<div class="spinner">⏳ Claude arbeitet…</div>';
      try {
        if (mode === "create") {
          out.innerHTML = '<div class="spinner">⏳ Vorschau wird erstellt…</div>';
          pendingCreate = await api("/preview-create", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: text, dataset_id: $("dataset").value })
          });
          const dropped = pendingCreate.dropped || [];
          const droppedNote = dropped.length
            ? `<p class="hint">ℹ️ ${dropped.length} nicht darstellbare(s) Visual(s) wurden automatisch weggelassen: ${dropped.join(", ")}</p>`
            : "";
          out.innerHTML =
            `<div class="explain">Vorschau für „${pendingCreate.title}" – so würde das neue Dashboard aussehen:</div>` +
            droppedNote +
            `<div class="preview" id="createPreview" style="margin:12px 0"></div>` +
            `<div class="actions"><button class="sec" id="cCancel">Verwerfen</button>` +
            `<button class="prim" id="cAccept">Übernehmen</button></div>`;
          embedPreview(pendingCreate.preview_report_id, "createPreview");
          $("cCancel").onclick = discardCreate;
          $("cAccept").onclick = acceptCreate;
        } else if (mode === "sharepoint") {
          out.innerHTML = '<div class="spinner">⏳ SharePoint wird durchsucht…</div>';
          pendingSp = await api("/sharepoint/plan-model", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: text })
          });
          renderSpPlan(pendingSp);
        } else if (mode === "measure") {
          const d = await api("/add-measure", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: text, dataset_id: $("dataset").value })
          });
          out.innerHTML =
            `<p class="ok">✅ Kennzahl „${d.measure}" wurde dem Modell hinzugefügt.</p>` +
            `<div class="explain">${d.explanation}</div>` +
            `<pre>'${d.table}'[${d.measure}] = ${d.dax}${d.format ? "   (Format: " + d.format + ")" : ""}</pre>`;
        } else {
          out.innerHTML = '<div class="spinner">⏳ Vorschau wird erstellt…</div>';
          pendingPlan = await api("/preview-modify", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ report_id: $("report").value, prompt: text })
          });
          // Temporären Vorschau-Report mit dem NEUEN Stand einbetten (falls möglich)
          let previewNote;
          if (pendingPlan.preview_report_id) {
            embedPreview(pendingPlan.preview_report_id);
            previewNote = '<p class="hint">☝️ Die Vorschau oben zeigt bereits den neuen Stand.</p>';
          } else {
            previewNote = '<p class="hint">ℹ️ Für dieses (klassische) Format gibt es keine Live-Vorschau vor dem Anwenden – nach „Anwenden" siehst du das Ergebnis oben.</p>';
          }
          const items = (pendingPlan.preview || []).map(x => `<li>${x}</li>`).join("");
          out.innerHTML = `<div class="explain">${pendingPlan.summary}</div>` + previewNote +
            `<ul class="log">${items || "<li>Keine Änderungen geplant.</li>"}</ul>` +
            `<div class="actions"><button class="sec" id="cancelBtn">Verwerfen</button>` +
            `<button class="prim" id="applyBtn">Anwenden</button></div>`;
          $("cancelBtn").onclick = discardPlan;
          $("applyBtn").onclick = applyPlan;
        }
      } catch (e) {
        out.innerHTML = `<div class="err">Fehler: ${e.message}</div>`;
      } finally { $("go").disabled = false; }
    }

    async function applyPlan() {
      if (!pendingPlan) return;
      const out = $("result");
      const p = pendingPlan; pendingPlan = null;
      out.innerHTML = '<div class="spinner">⏳ Änderungen werden angewendet…</div>';
      try {
        const d = await api("/confirm-modify", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ report_id: p.report_id, edits: p.edits,
                                 preview_report_id: p.preview_report_id })
        });
        const items = (d.applied || []).map(x => `<li>${x}</li>`).join("");
        out.innerHTML = `<p class="ok">✅ Änderungen angewendet.</p>` +
          `<ul class="log">${items}</ul>` + openLink(p.report_id) + undoButton();
        wireUndo();
        embedPreview();  // Original mit neuem Stand einbetten
      } catch (e) {
        out.innerHTML = `<div class="err">Fehler: ${e.message}</div>`;
      }
    }

    async function discardPlan() {
      const p = pendingPlan; pendingPlan = null;
      $("result").innerHTML = "";
      embedPreview();  // zurück zum Original
      if (p && p.preview_report_id) {
        try {
          await api("/discard-preview", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ preview_report_id: p.preview_report_id })
          });
        } catch (e) { /* Aufräumen best effort */ }
      }
    }

    async function acceptCreate() {
      if (!pendingCreate) return;
      const p = pendingCreate; pendingCreate = null;
      const out = $("result");
      out.innerHTML = '<div class="spinner">⏳ Wird übernommen…</div>';
      try {
        const d = await api("/confirm-create", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ preview_report_id: p.preview_report_id, display_name: p.title })
        });
        out.innerHTML = `<p class="ok">✅ Report „${d.created}" wurde erstellt.</p>` +
          openLink(d.report_id) + undoButton();
        wireUndo(); loadReports();
      } catch (e) {
        out.innerHTML = `<div class="err">Fehler: ${e.message}</div>`;
      }
    }

    async function discardCreate() {
      const p = pendingCreate; pendingCreate = null;
      $("result").innerHTML = "";
      if (p && p.preview_report_id) {
        try {
          await api("/discard-preview", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ preview_report_id: p.preview_report_id })
          });
        } catch (e) { /* Aufräumen best effort */ }
      }
    }

    $("go").onclick = run;

    // ── Modell/Tabelle aus Datei (Phase 2) ───────────────────────
    let importFileObj = null;
    const TYPE_LABEL = { int64: "Ganzzahl", double: "Dezimalzahl", dateTime: "Datum",
                         boolean: "Ja/Nein", string: "Text" };
    const typeLabel = (t) => TYPE_LABEL[t] || t;
    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    function setImportTargetUI() {
      const existing = $("importTarget").value === "existing";
      $("importExistingRow").style.display = existing ? "" : "none";
      $("importModelNameRow").style.display = existing ? "none" : "";
    }
    $("importTarget").onchange = () => { setImportTargetUI(); $("result").innerHTML = ""; };
    $("importFile").onchange = () => { importFileObj = $("importFile").files[0] || null; };
    $("importGo").onclick = importPreview;

    async function importPreview() {
      const out = $("result");
      if (!importFileObj) { out.innerHTML = '<div class="err">Bitte zuerst eine Datei wählen.</div>'; return; }
      const fd = new FormData(); fd.append("file", importFileObj);
      $("importGo").disabled = true;
      out.innerHTML = '<div class="spinner">⏳ Datei wird geprüft…</div>';
      try {
        const d = await api("/import/preview", { method: "POST", body: fd });
        renderImportPreview(d);
      } catch (e) {
        out.innerHTML = `<div class="err">Fehler: ${e.message}</div>`;
      } finally { $("importGo").disabled = false; }
    }

    function renderImportPreview(d) {
      const isNew = $("importTarget").value === "new";
      const tblName = $("importTableName").value.trim() || d.suggested_table;
      const head = (d.columns || []).map(c =>
        `<th>${escapeHtml(c.name)}<br><span class="muted" style="font-weight:400">${typeLabel(c.type)}</span></th>`).join("");
      const body = (d.sample_rows || []).map(r =>
        `<tr>${r.map(v => `<td>${escapeHtml(v)}</td>`).join("")}</tr>`).join("");
      const trunc = d.truncated
        ? `<p class="hint">⚠️ Die Datei hat mehr als 10.000 Zeilen – es werden nur die ersten 10.000 übernommen.</p>` : "";
      $("result").innerHTML =
        `<div class="explain">Erkannt: <b>${d.columns.length} Spalten</b>, <b>${d.row_count} Zeilen</b>. ` +
        `Tabelle wird „<b>${escapeHtml(tblName)}</b>" heißen.</div>` +
        `<div style="overflow-x:auto;margin-top:12px"><table class="prev"><tr>${head}</tr>${body}</table></div>` +
        `<p class="hint">Vorschau der ersten Zeilen.</p>` + trunc +
        `<div class="actions"><button class="sec" id="impCancel">Abbrechen</button>` +
        `<button class="prim" id="impConfirm">${isNew ? "Modell anlegen" : "Tabelle hinzufügen"}</button></div>` +
        `<p class="hint">Danach werden die Daten geladen – das dauert i. d. R. ~1 Minute.</p>`;
      $("impCancel").onclick = () => { $("result").innerHTML = ""; };
      $("impConfirm").onclick = importConfirm;
    }

    async function importConfirm() {
      const isNew = $("importTarget").value === "new";
      const out = $("result");
      const fd = new FormData(); fd.append("file", importFileObj);
      const tn = $("importTableName").value.trim(); if (tn) fd.append("table_name", tn);
      let url;
      if (isNew) {
        const mn = $("importModelName").value.trim();
        if (!mn) { out.innerHTML = '<div class="err">Bitte einen Modellnamen angeben.</div>'; return; }
        fd.append("model_name", mn); url = "/import/create-model";
      } else {
        const ds = $("importDataset").value;
        if (!ds) { out.innerHTML = '<div class="err">Bitte ein Zielmodell wählen.</div>'; return; }
        fd.append("dataset_id", ds); url = "/import/add-table";
      }
      out.innerHTML = '<div class="spinner">⏳ Wird angelegt und Daten werden geladen… (~1 Min., bitte warten)</div>';
      try {
        const d = await api(url, { method: "POST", body: fd });
        const rowsInfo = (d.rows == null)
          ? "Die Daten werden noch im Hintergrund geladen."
          : `${d.rows} Zeilen geladen.`;
        const title = isNew
          ? `Modell „${escapeHtml(d.model_name)}" wurde angelegt`
          : `Tabelle „${escapeHtml(d.table_name)}" wurde hinzugefügt`;
        out.innerHTML = `<p class="ok">✅ ${title}.</p>` +
          `<div class="explain">Tabelle „${escapeHtml(d.table_name)}" · ${rowsInfo}</div>` +
          `<p class="hint">Das Modell steht jetzt in „Dashboard erstellen" und „Kennzahl hinzufügen" zur Auswahl.</p>`;
        refreshDatasets();
      } catch (e) {
        out.innerHTML = `<div class="err">Fehler: ${e.message}</div>`;
      }
    }

    // ── Modell aus SharePoint (Phase 3) ──────────────────────────
    function renderSpPlan(p) {
      const rows = (p.tables || []).map(t => {
        const shown = (t.sample_files || []).map(escapeHtml).join(", ");
        const more = t.file_count > (t.sample_files || []).length
          ? ` … (+${t.file_count - t.sample_files.length} weitere)` : "";
        const rec = t.recursive
          ? ' <b>inkl. Unterordner</b> – neue Dateien fließen automatisch mit' : "";
        return `<li><span class="vt">${escapeHtml(t.table_name)}</span>` +
               `<span class="muted">📁 ${escapeHtml(t.folder)}${rec} · ` +
               `${t.file_count} Datei(en): ${shown}${more}</span></li>`;
      }).join("");
      const dropped = (p.dropped || []).length
        ? `<p class="hint">ℹ️ ${p.dropped.length} vorgeschlagene(r) Ordner existiert nicht und wurde verworfen.</p>` : "";
      $("result").innerHTML =
        `<div class="explain">${escapeHtml(p.summary)}</div>` + dropped +
        `<p class="hint">Neues Modell: <b>${escapeHtml(p.model_name)}</b> — diese Tabellen entstehen:</p>` +
        `<ul class="log">${rows || "<li>Keine passenden Ordner gefunden.</li>"}</ul>` +
        `<div class="actions"><button class="sec" id="spCancel">Verwerfen</button>` +
        `<button class="prim" id="spCreate">Modell anlegen</button></div>` +
        `<p class="hint">Danach werden die Daten geladen – das dauert i. d. R. ~1 Minute.</p>`;
      $("spCancel").onclick = () => { pendingSp = null; $("result").innerHTML = ""; };
      $("spCreate").onclick = createSpModel;
    }

    async function createSpModel() {
      if (!pendingSp) return;
      const p = pendingSp; pendingSp = null;
      const out = $("result");
      out.innerHTML = '<div class="spinner">⏳ Modell wird angelegt und Daten werden geladen… (~1 Min., bitte warten)</div>';
      try {
        const d = await api("/sharepoint/create-model", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model_name: p.model_name,
            // files MUSS mit – sonst nimmt das Backend alle Dateien des Ordners
            tables: (p.tables || []).map(t => ({
              folder: t.folder, table_name: t.table_name,
              files: t.files, recursive: t.recursive
            }))
          })
        });
        const rows = (d.tables || []).map(t =>
          `<li><span class="vt">${escapeHtml(t.table_name)}</span>` +
          `<span class="muted">${(t.columns || []).length} Spalten · ${t.file_count} Datei(en)` +
          `${t.recursive ? " inkl. Unterordner" : ""}</span></li>`
        ).join("");
        out.innerHTML = `<p class="ok">✅ Modell „${escapeHtml(d.model_name)}" wurde angelegt.</p>` +
          `<ul class="log">${rows}</ul>` +
          `<div class="explain"><b>Noch ein letzter Schritt:</b> Das Modell liest die Daten direkt ` +
          `aus SharePoint – dafür muss die Datenquelle einmalig autorisiert werden.</div>` +
          `<ol class="log"><li><a class="open" style="margin:6px 0" href="${d.settings_url}" target="_blank">Einstellungen in Power BI öffnen ↗</a></li>` +
          `<li>Oben auf <b>„Übernehmen"</b> klicken</li>` +
          `<li><b>Datenquellen-Anmeldeinformationen</b> → <b>Anmeldeinformationen bearbeiten</b> → OAuth2 → anmelden</li>` +
          `<li>Zurück hierher und <b>„Daten laden"</b> klicken</li></ol>` +
          `<div class="actions"><button class="prim" id="spLoad">Daten laden</button></div>`;
        $("spLoad").onclick = () => loadSpData(d.model_id, (d.tables[0] || {}).table_name);
        refreshDatasets();
      } catch (e) {
        out.innerHTML = `<div class="err">Fehler: ${e.message}</div>`;
      }
    }

    async function loadSpData(modelId, tableName) {
      const out = $("result");
      $("spLoad").disabled = true;
      const note = document.createElement("div");
      note.className = "spinner";
      note.textContent = "⏳ Daten werden aus SharePoint geladen… (~1 Min., bitte warten)";
      out.appendChild(note);
      try {
        const d = await api("/sharepoint/load-data", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ model_id: modelId, table_name: tableName })
        });
        out.innerHTML = (d.rows == null)
          ? `<p class="ok">✅ Aktualisierung gestartet.</p><p class="hint">Die Daten werden noch im Hintergrund geladen – schau gleich nochmal in Power BI.</p>`
          : `<p class="ok">✅ ${d.rows} Zeilen aus SharePoint geladen.</p>` +
            `<p class="hint">Das Modell steht jetzt in „Dashboard erstellen" und „Kennzahl hinzufügen" zur Auswahl.</p>`;
      } catch (e) {
        note.remove();
        const err = document.createElement("div");
        err.className = "err";
        err.textContent = "Fehler: " + e.message;
        out.appendChild(err);
        $("spLoad").disabled = false;
      }
    }
  </script>
</body>
</html>
